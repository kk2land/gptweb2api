# 公网 MCP 代理：前面固定使用 Nginx，Go 只监听本机 HTTP。
# 配置设计样例，部署时复制为 mcp-relay.toml 并填写实际值。

[server]
listen = "127.0.0.1:8787"
public_base_url = "https://mcp.example.com"

[auth]
oauth_issuer = "https://auth.example.com"

[[devices]]
id = "local-01"
token = "REPLACE_WITH_DEVICE_TOKEN"
allowed_subjects = ["REPLACE_WITH_OAUTH_SUBJECT"]

[log]
max_size_mb = 20      # 单份日志大小，按 MiB 计算
max_backups = 10      # 历史文件数量，不包含当前日志
