# 本地 MCP + API 网关：前面固定使用 Nginx，Go 只监听本机 HTTP。
# 配置设计样例，部署时复制为 mcp-gateway.toml 并填写实际值。

[server]
listen = "127.0.0.1:8788"
api_key = "REPLACE_WITH_API_KEY"

[relay]
url = "wss://mcp.example.com/agent"
device_id = "local-01"
token = "REPLACE_WITH_DEVICE_TOKEN" # 与公网代理中对应设备的 token 一致

[tasks]
max_concurrency = 2                # 每个活动执行槽独占一个 Ego Space
queue_capacity = 20                # 等待队列上限，不含活动任务
timeout = "30m"                    # 总期限，包含排队、执行和等待审批

[dots]
enabled = false
dot_id = ""                        # 开启时填写；同一 Dot 固定串行执行

[[workspaces]]
id = "default"
root = "/absolute/path/to/your/project"
chatgpt_project_id = ""             # 空为普通聊天；非空必须校验项目归属
read_only = false
allow_commands = false

[log]
max_size_mb = 20
max_backups = 10
