# 本地单进程网关：Nginx 提供 API 入口；MCP 通过内嵌官方 Tunnel SDK 出站连接。
# 配置设计样例，部署时复制为 mcp-gateway.toml 并填写实际值。

[server]
listen = "127.0.0.1:8788"
api_key = "REPLACE_WITH_API_KEY"

[tunnel]
id = "REPLACE_WITH_TUNNEL_ID"
api_key = "REPLACE_WITH_RUNTIME_API_KEY" # Platform Tunnels Read + Use；不同于上面的 API key

[tasks]
max_concurrency = 2                # 每个活动执行槽独占一个 Ego Space
queue_capacity = 20                # 等待队列上限，不含活动任务
timeout = "30m"                    # 总期限，包含排队、执行和等待审批

[dots]
enabled = false                  # 不提供 ChatGPT 项目或原生会话切换

[log]
max_size_mb = 20
max_backups = 10
